services:
  recon-monitor:
    build: .
    image: recon-monitor:latest
    container_name: recon-monitor
    restart: unless-stopped
    # Credenciales (Ubersmith y MySQL remoto) desde .env; no se copian a la imagen.
    env_file: .env
    environment:
      TZ: America/Puerto_Rico
      # Una ejecución al día a esta hora (America/Puerto_Rico). Sobrescribible desde .env.
      CONNEX_DAILY_AT: ${CONNEX_DAILY_AT:-06:00}
      # Solo corre de lunes a jueves; viernes, sábado y domingo no hace nada.
      CONNEX_RUN_DAYS: ${CONNEX_RUN_DAYS:-mon,tue,wed,thu}
      # 1 = ejecuta un ciclo al arrancar el contenedor además del diario.
      CONNEX_RUN_ON_START: ${CONNEX_RUN_ON_START:-0}
      # Seguro por defecto: no crea tickets ni escribe. Poner CONNEX_DRY_RUN=0 en .env para producción.
      CONNEX_DRY_RUN: ${CONNEX_DRY_RUN:-1}
    # MySQL es un servidor remoto: no hay servicio de base de datos aquí.
    # Si el MySQL está en el host Docker, usa MYSQL_HOST=host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
